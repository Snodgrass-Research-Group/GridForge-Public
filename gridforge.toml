# Regional end-to-end validation run. The author confirmed (2026-07-11) the
# dissertation generation configuration: DynamicAdd=1 + NewLineCost=5
# (four-cell experiment grid in docs/algorithms/GarverAlgorithmCPLEX.md
# §Open questions; FLO completes in ~1h47m at ratio 1.308).
# checkpoint_dir is where every stage checkpoint goes; on a fresh clone the
# run starts with FLO-Grid (the 9,113-branch topology).
# Run from the repository root (paths are relative to the working directory):
#     uv run gridforge run --config gridforge.toml
# Resume-safe: re-running picks up from the newest checkpoint.
# gurobi_threads/gurobi_mem_gb 0 = auto-size from the machine (solver.py:
# Threads = physical cores with OS headroom, MemLimit = 80% of available
# RAM). Dual simplex is single-threaded anyway (barrier benchmarked SLOWER
# on the 25M-var LP: 2,003s vs 1,846s); threads help the QP/MILP dispatch.

[run]
region = "SRTV"
voltage_variant = "230 345 500 765 kV"
seed = 42
data_store = "data_store"
checkpoint_dir = "runs/dyn5_test"
gurobi_threads = 0
verbose = false

[flo]
phases = ["ed", "converse_ed", "n1_ed"]

[flo.garver]
dynamic_add = true
new_line_cost = 5.0

[scale]
stages = ["dispatch", "init_electrical", "dc_homotopy_1",
          "voltage_separation", "dc_homotopy_2", "transformers",
          "dc_homotopy_3", "reports"]
